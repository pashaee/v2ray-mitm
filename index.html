<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>V2ray+mitm (Config.json)</title>
    <!-- اضافه کردن فونت فارسی Vazirmatn -->
    <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.0.0/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
    <style>
        :root {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --primary-color: #bb86fc;
            --primary-hover: #9e67e3;
            --input-bg: #2d2d2d;
            --border-color: #3d3d3d;
            --success-color: #03dac6;
        }

        /* اعمال اجباری فونت وزیر برای تمام عناصر صفحه */
        * {
            font-family: 'Vazirmatn', Tahoma, sans-serif !important;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 700px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            box-sizing: border-box;
        }

        h1 {
            text-align: center;
            margin: 0;
            font-size: 1.3rem;
            font-weight: 500;
            color: #ffffff;
            letter-spacing: 0.5px;
        }

        textarea {
            width: 100%;
            background-color: var(--input-bg);
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 8px;
            padding: 15px;
            font-size: 14px;
            resize: vertical;
            box-sizing: border-box;
        }

        textarea:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* راست‌چین کردن کادر ورود کانفیگ */
        #configInput {
            min-height: 100px;
            direction: rtl;
            text-align: right;
        }

        /* چپ‌چین ماندن خروجی JSON برای خوانایی بهتر کدها */
        #jsonOutput {
            min-height: 300px;
            white-space: pre-wrap;
            direction: ltr;
            text-align: left;
        }

        button {
            background-color: var(--primary-color);
            color: #000;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            width: 100%;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        #copyBtn {
            background-color: var(--success-color);
            margin-top: 10px;
        }

        #copyBtn:hover {
            background-color: #01bdae;
        }

        .output-section {
            display: none;
            animation: fadeIn 0.5s ease;
        }

        .label-title {
            font-size: 14px;
            margin-bottom: 8px;
            display: block;
            color: #aaa;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* تنظیمات ریسپانسیو برای نمایشگرهای کوچک و موبایل */
        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .container {
                padding: 20px 15px;
                gap: 15px;
            }
            h1 {
                font-size: 1.1rem;
            }
            textarea {
                padding: 12px;
                font-size: 13px;
            }
            button {
                font-size: 14px;
                padding: 10px 15px;
            }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>تبدیل لینک V2Ray به V2ray+mitm</h1>
        
        <div>
            <label class="label-title" for="configInput">لینک کانفیگ خود را وارد کنید (vless ws):</label>
            <textarea id="configInput" placeholder="کانفیگ خود را وارد کنید..."></textarea>
        </div>
        
        <button id="convertBtn">تبدیل اکانت</button>
        
        <div class="output-section" id="outputContainer">
            <label class="label-title">خروجی JSON (config.json):</label>
            <textarea id="jsonOutput" readonly></textarea>
            <button id="copyBtn">کپی کانفیگ</button>
        </div>
    </div>

    <script>
        // ساختار پایه JSON مورد نظر شما
        const baseConfig = {
            "remarks": "",
            "log": {
                "loglevel": "warning"
            },
  "dns": {
    "servers": [
       "94.140.14.14",
"94.140.15.15"
    ],
    "queryStrategy": "UseIPv4"
  },
            
            "inbounds": [
                {
                    "tag": "socks",
                    "port": 10808,
                    "listen": "0.0.0.0",
                    "protocol": "mixed",
                    "sniffing": {

                        "destOverride": [
                            "http",
                            "tls",
                            "quic"
                        ],
                        "routeOnly": false
                    },
                    "settings": {
                        "auth": "noauth",
                        "udp": true,
                        "allowTransparent": false
                    }
                },
                {

                    "listen": "0.0.0.0",
                    "port": 40444,

                    "settings": {

                    },
                    "streamSettings": {

                            "tcpKeepAliveIdle": 11
                        },
                        "security": "tls",
                        "tlsSettings": {
                            "alpn": ["h2", "http/1.1"],
                            "certificates": [
                                {
                                    "usage": "issue",
                                    "buildChain": true,
                                    "certificate": [ "-----BEGIN CERTIFICATE-----", "MIIBozCCAUmgAwIBAgIQcEap9OyNauSbu9WIjBrE7DAKBggqhkjOPQQDAjAmMREw", "DwYDVQQKEwhYcmF5IEluYzERMA8GA1UEAxMIWHJheSBJbmMwIBcNMjYwODA3MTU0", "NjQ5WhgPMjE0MDA5MDUwODQ2NDlaMCYxETAPBgNVBAoTCFhyYXkgSW5jMREwDwYD", "VQQDEwhYcmF5IEluYzBZMBMGByqGSM49AgEGCCqGSM49AwEHA0IABPPO9mvAOSm9", "+zuukL9WsgyoczQimK2xxFfDHZOvGLq3TXiCNeVwTqiCBsqwx424yhUUT8rK8HPb", "WPAYDE6ttaujVzBVMA4GA1UdDwEB/wQEAwICpDATBgNVHSUEDDAKBggrBgEFBQcD", "ATAPBgNVHRMBAf8EBTADAQH/MB0GA1UdDgQWBBSqTVNjHBZAJhMgLyC57rMYUsSW", "jjAKBggqhkjOPQQDAgNIADBFAiBpvu+yogzeo7NqaXOiD+sHhC6E0RijO8ogkUX6", "2ebPhwIhAO2yiZfK22SOYSVmJ7BuMbkAn45WrglHsqz8p4J+DaLS", "-----END CERTIFICATE-----" ],
              "key": [ "-----BEGIN EC PRIVATE KEY-----", "MIGHAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBG0wawIBAQQg35ZH25uH4yAEnemA", "w5EQ72jDwGq78+wT6iOxzbzWdFKhRANCAATzzvZrwDkpvfs7rpC/VrIMqHM0Ipit", "scRXwx2Trxi6t014gjXlcE6oggbKsMeNuMoVFE/KyvBz21jwGAxOrbWr", "-----END EC PRIVATE KEY-----" ]
            }
                            ]

                    },
                    "streamSettings": {

                        "security": "tls",
                        "tlsSettings": {

                            "fingerprint": "ios",

                               "wsSettings": {
          "path": "/",
          "headers": {

          }

      }
    },

                            "verifyPeerCertByName": "fromMitM",

                {

                    "protocol": "blackhole"
                }
            ],
            "routing": {
                "domainStrategy": "IPIfNonMatch",
                "rules": [
                    {
                        "type": "field",
                        "port": 53,
                        "outboundTag": "proxy"
                    },
                    {
                        "type": "field",
                        "ip": [  "94.140.14.14",
"94.140.15.15" ],
                        "outboundTag": "proxy"
                    },
                    {
                        "type": "field",
                        "inboundTag": ["tls-decrypt-h211"],
                        "outboundTag": "tls-repack-frommitm"
                    },
                    {
                        "type": "field",
                        "outboundTag": "direct",
                        "domain": [
                            "domain:.ir"
                        ]
                    }
                ]
            }
        };

        document.getElementById('convertBtn').addEventListener('click', function() {
            const inputStr = document.getElementById('configInput').value.trim();
            
            if (!inputStr) {
                alert("ابتدا لطفاً لینک کانفیگ خود را در کادر بالا وارد کنید.");
                return;
            }

            let uuid = "", sni = "", accountName = "";

            try {
                // استخراج اطلاعات اگر لینک vmess (Base64) باشد
                if (inputStr.startsWith("vmess://")) {
                    const base64Str = inputStr.substring(8);
                    const decoded = decodeURIComponent(escape(atob(base64Str)));
                    const vmessObj = JSON.parse(decoded);
                    
                    uuid = vmessObj.id || "";
                    sni = vmessObj.sni || vmessObj.host || vmessObj.add || "";
                    accountName = vmessObj.ps || "";
                } 
                // استخراج اطلاعات برای لینک‌های استاندارد مثل vless:// 
                else {
                    const fakeUrlStr = inputStr.replace(/^[a-zA-Z]+:\/\//, 'http://');
                    const url = new URL(fakeUrlStr);
                    
                    uuid = url.username;
                    sni = url.searchParams.get('sni') || url.hostname;
                    
                    // استخراج نام اکانت از هشتگ (hash)
                    if (url.hash) {
                        accountName = decodeURIComponent(url.hash.substring(1));
                    }
                }
            } catch (e) {
                // روش جایگزین با Regex در صورتی که URL نامعتبر باشد
                const uuidMatch = inputStr.match(/:\/\/(.+?)@/);
                if (uuidMatch) uuid = uuidMatch[1];
                
                const sniMatch = inputStr.match(/[?&]sni=([^&#]+)/);
                if (sniMatch) sni = sniMatch[1];
                
                const nameMatch = inputStr.match(/#(.+)$/);
                if (nameMatch) accountName = decodeURIComponent(nameMatch[1]);
            }

            if (!uuid) {
                alert("شناسه UUID در این کانفیگ یافت نشد! لطفاً یک کانفیگ معتبر وارد کنید.");
                return;
            }

            if (!sni) sni = "your-domain.com";

            // یک کپی از فایل قالب می‌گیریم تا اصلی تغییر نکند
            const newConfig = JSON.parse(JSON.stringify(baseConfig));

            // ایجاد متن remarks با اضافه کردن "اصلاح شده"
            if (accountName) {
                newConfig.remarks = accountName + " اصلاح شده";
            } else {
                newConfig.remarks = "کانفیگ اصلاح شده";
            }

            // جاگذاری مقادیر استخراج شده در قالب
            newConfig.outbounds[0].settings.vnext[0].users[0].id = uuid;
            newConfig.outbounds[0].streamSettings.tlsSettings.serverName = sni;

            // نمایش خروجی JSON در کادر
            const outputElem = document.getElementById('jsonOutput');
            outputElem.value = JSON.stringify(newConfig, null, 2);
            
            // نمایش بخش خروجی
            document.getElementById('outputContainer').style.display = 'block';
        });

        // تنظیم عملکرد دکمه کپی
        document.getElementById('copyBtn').addEventListener('click', function() {
            const outputElem = document.getElementById('jsonOutput');
            outputElem.select();
            outputElem.setSelectionRange(0, 99999); // برای موبایل
            
            navigator.clipboard.writeText(outputElem.value).then(() => {
                const btn = document.getElementById('copyBtn');
                const originalText = btn.innerText;
                btn.innerText = "کانفیگ کپی شد! ✔";
                btn.style.backgroundColor = "#4caf50";
                
                setTimeout(() => {
                    btn.innerText = originalText;
                    btn.style.backgroundColor = "var(--success-color)";
                }, 2000);
            }).catch(err => {
                alert("خطا در کپی کردن: " + err);
            });
        });
    </script>
</body>
</html>
